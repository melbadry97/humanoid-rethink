[project]
name = "hrethink"
version = "0.1.0"
description = "Recursive LLM-driven morphology + controller co-design for agile humanoids in MuJoCo"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.2", "numpy>=1.26", "pydantic>=2.6"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hrethink"]
